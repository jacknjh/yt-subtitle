<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Subtitle Compatibility</title>
  <style>
    /* shortcut: fixed dark diagnostic palette; match host themes in the production panel. */
    body { padding: 16px; font-size: 13px; background-color: #292929; color: #f5f5f5; }
    h1, p, label { color: #f5f5f5; }
    h1 { font-size: 18px; margin-bottom: 12px; }
    p { margin-bottom: 12px; }
    sp-button { margin: 0 0 8px 0; }
    textarea { width: 100%; height: 220px; margin-top: 8px; background-color: #1e1e1e; color: #f5f5f5; border: 1px solid #808080; }
  </style>
</head>
<body>
  <h1>Subtitle compatibility</h1>
  <p>Open a transcribed sequence to check transcript access. Select one text graphic to inspect its controls.</p>
  <sp-button id="transcript">Read sequence transcript</sp-button>
  <sp-button id="graphic">Inspect selected graphic</sp-button>
  <p id="status" role="status" aria-live="polite">Ready. These checks leave the timeline unchanged.</p>
  <label for="report">Diagnostic result</label>
  <textarea id="report" readonly aria-label="Diagnostic result"></textarea>
  <sp-button id="save-report" disabled>Save diagnostic report</sp-button>
  <sp-button id="save-transcript" disabled>Save transcript JSON</sp-button>
  <script src="main.js"></script>
</body>
</html>
